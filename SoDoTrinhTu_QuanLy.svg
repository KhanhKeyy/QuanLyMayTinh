<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600" style="background-color: #0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="actorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="daoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="section1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(234, 179, 8, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section5Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>

    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>

    <marker id="arrow-dash" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1520" height="70" rx="12" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="58" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="1">SƠ ĐỒ TRÌNH TỰ NGHIỆP VỤ — ROLE QUẢN LÝ (IsQuanLy)</text>
  <text x="800" y="80" text-anchor="middle" fill="#94a3b8" font-size="13">TOÀN QUYỀN HỆ THỐNG: DUYỆT ĐỀ XUẤT, QUẢN LÝ HÀNG HÓA - NHÂN VIÊN, NHẬP HÀNG &amp; BÁO CÁO</text>

  <!-- Participant Lifelines -->
  <!-- X Coordinates:
       1. Quản lý (Manager): 180
       2. Trung tâm Thông báo (frmThongBao): 460
       3. Màn hình Hàng hóa / Tồn kho (frmSanPham / TonKho): 720
       4. Màn hình Nhân sự / Nhập hàng (frmNhanVien / PhieuNhap): 980
       5. DAO Services (Toàn bộ DAO): 1240
       6. SQL Server Database: 1460
  -->

  <!-- Lifeline Vertical Lines -->
  <line x1="180" y1="170" x2="180" y2="1510" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="460" y1="170" x2="460" y2="1510" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="720" y1="170" x2="720" y2="1510" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="980" y1="170" x2="980" y2="1510" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1240" y1="170" x2="1240" y2="1510" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1460" y1="170" x2="1460" y2="1510" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Top Participant Header Boxes -->
  <g filter="url(#shadow)">
    <!-- Manager -->
    <rect x="90" y="115" width="180" height="50" rx="8" fill="url(#actorGrad)" stroke="#facc15" stroke-width="1.5"/>
    <text x="180" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">👑 Quản Lý</text>

    <!-- frmThongBao -->
    <rect x="370" y="115" width="180" height="50" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="460" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🔔 Form Thông Báo</text>

    <!-- frmSanPham & TonKho -->
    <rect x="630" y="115" width="180" height="50" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="720" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">📦 Hàng Hóa &amp; Kho</text>

    <!-- frmNhanVien & PhieuNhap -->
    <rect x="890" y="115" width="180" height="50" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="980" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">👥 Nhân Sự &amp; Nhập Hàng</text>

    <!-- DAO -->
    <rect x="1150" y="115" width="180" height="50" rx="8" fill="url(#daoGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1240" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">⚙️ DAO Services</text>

    <!-- Database -->
    <rect x="1380" y="115" width="160" height="50" rx="8" fill="url(#dbGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1460" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🗄️ SQL Database</text>
  </g>

  <!-- ========================================================================================= -->
  <!-- LUỒNG 1: KIỂM DUYỆT ĐỀ XUẤT SẢN PHẨM MỚI TỪ NHÂN VIÊN -->
  <!-- ========================================================================================= -->

  <rect x="50" y="185" width="1500" height="270" rx="10" fill="url(#section1Grad)" stroke="#854d0e" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="195" width="480" height="26" rx="5" fill="#854d0e"/>
  <text x="70" y="213" fill="#fef08a" font-size="13" font-weight="bold">LUỒNG 1: KIỂM DUYỆT &amp; PHÊ DUYỆT ĐỀ XUẤT SẢN PHẨM MỚI TỪ NV</text>

  <!-- 1.1 Open notification form -->
  <line x1="180" y1="240" x2="460" y2="240" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="320" y="233" text-anchor="middle" fill="#fef08a" font-size="12">1. Mở [frmThongBao] -&gt; Xem cột [📋 Duyệt đề xuất]</text>

  <!-- 1.2 Review & Approve -->
  <line x1="180" y1="270" x2="460" y2="270" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="320" y="263" text-anchor="middle" fill="#fef08a" font-size="12">2. Mở [frmKiemDuyetDeXuat] -&gt; Bấm [✅ Duyệt &amp; Thêm sản phẩm]</text>

  <line x1="460" y1="300" x2="1240" y2="300" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="850" y="293" text-anchor="middle" fill="#6ee7b7" font-size="12">3. YeuCauThemSanPhamDAO.DuyetYeuCau(maYC, maNV)</text>

  <line x1="1240" y1="330" x2="1460" y2="330" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1350" y="323" text-anchor="middle" fill="#fde047" font-size="12">4. INSERT SanPham &amp; UPDATE YeuCau (TrangThai = 'Da duyet')</text>

  <path d="M 1240 330 Q 1300 345 1300 360 T 1240 375" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1310" y="358" fill="#6ee7b7" font-size="11">ThongBaoDAO.GuiThongBaoChoNhanVienDeXuat("✅ Phê duyệt đề xuất")</text>

  <line x1="1240" y1="415" x2="180" y2="415" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="710" y="408" text-anchor="middle" fill="#cbd5e1" font-size="11">Duyệt thành công: Sản phẩm chính thức cập nhật danh mục &amp; Tự động báo NV</text>


  <!-- ========================================================================================= -->
  <!-- LUỒNG 2: TOÀN QUYỀN QUẢN LÝ SẢN PHẨM & TỒN KHO (FULL CRUD) -->
  <!-- ========================================================================================= -->

  <rect x="50" y="475" width="1500" height="260" rx="10" fill="url(#section2Grad)" stroke="#581c87" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="485" width="510" height="26" rx="5" fill="#581c87"/>
  <text x="70" y="503" fill="#d8b4fe" font-size="13" font-weight="bold">LUỒNG 2: TOÀN QUYỀN THÊM, SỬA, XÓA HÀNG HÓA &amp; QUẢN LÝ TỒN KHO</text>

  <line x1="180" y1="530" x2="720" y2="530" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="450" y="523" text-anchor="middle" fill="#fef08a" font-size="12">1. Mở [frmSanPham] -&gt; Thêm/Sửa/Xóa sản phẩm &amp; Danh mục</text>

  <line x1="720" y1="560" x2="1240" y2="560" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="980" y="553" text-anchor="middle" fill="#6ee7b7" font-size="12">2. SanPhamDAO.Insert() / Update() / Delete()</text>

  <line x1="1240" y1="590" x2="1460" y2="590" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1350" y="583" text-anchor="middle" fill="#fde047" font-size="12">3. Cập nhật bảng SanPham &amp; DanhMucSanPham</text>

  <line x1="180" y1="630" x2="720" y2="630" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="450" y="623" text-anchor="middle" fill="#fef08a" font-size="12">4. Mở [frmTonKho] -&gt; Kiểm tra tồn kho toàn cửa hàng &amp; Phân trang (10 SP/trang)</text>

  <line x1="1240" y1="695" x2="180" y2="695" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="710" y="688" text-anchor="middle" fill="#cbd5e1" font-size="11">Cập nhật CSDL thành công &amp; Đồng bộ dữ liệu realtime toàn hệ thống</text>


  <!-- ========================================================================================= -->
  <!-- LUỒNG 3: QUẢN LÝ TÀI KHOẢN NHÂN VIÊN & KHÁCH HÀNG -->
  <!-- ========================================================================================= -->

  <rect x="50" y="755" width="1500" height="250" rx="10" fill="url(#section3Grad)" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="765" width="510" height="26" rx="5" fill="#1e3a8a"/>
  <text x="70" y="783" fill="#93c5fd" font-size="13" font-weight="bold">LUỒNG 3: QUẢN LÝ DANH SÁCH NHÂN VIÊN, KHÁCH HÀNG &amp; PHÂN QUYỀN ROLE</text>

  <line x1="180" y1="810" x2="980" y2="810" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="580" y="803" text-anchor="middle" fill="#fef08a" font-size="12">1. Mở [frmNhanVien] -&gt; Thêm/Sửa/Khóa tài khoản NV &amp; Gán Role (Quản lý/Bán hàng/Kế toán)</text>

  <line x1="980" y1="840" x2="1240" y2="840" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1110" y="833" text-anchor="middle" fill="#6ee7b7" font-size="12">2. NhanVienDAO.Insert() / Update() (ORDER BY MaNhanVien)</text>

  <line x1="1240" y1="870" x2="1460" y2="870" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1350" y="863" text-anchor="middle" fill="#fde047" font-size="12">3. INSERT / UPDATE NhanVien &amp; TaiKhoan</text>

  <line x1="1240" y1="965" x2="180" y2="965" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="710" y="958" text-anchor="middle" fill="#cbd5e1" font-size="11">Cập nhật tài khoản &amp; Phân quyền người dùng thành công</text>


  <!-- ========================================================================================= -->
  <!-- LUỒNG 4: NHẬP HÀNG TỪ NHÀ CUNG CẤP & QUẢN LÝ PHIẾU NHẬP -->
  <!-- ========================================================================================= -->

  <rect x="50" y="1025" width="1500" height="250" rx="10" fill="url(#section4Grad)" stroke="#064e3b" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="1035" width="510" height="26" rx="5" fill="#064e3b"/>
  <text x="70" y="1053" fill="#6ee7b7" font-size="13" font-weight="bold">LUỒNG 4: TẠO PHIẾU NHẬP HÀNG TỪ NHÀ CUNG CẤP &amp; TỰ ĐỘNG TĂNG TỒN KHO</text>

  <line x1="180" y1="1080" x2="980" y2="1080" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="580" y="1073" text-anchor="middle" fill="#fef08a" font-size="12">1. Mở [frmPhieuNhapHang] -&gt; Chọn NCC, sản phẩm &amp; số lượng nhập -&gt; Bấm [📦 Nhập hàng]</text>

  <line x1="980" y1="1110" x2="1240" y2="1110" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1110" y="1103" text-anchor="middle" fill="#6ee7b7" font-size="12">2. PhieuNhapHangDAO.Insert(pn, ctList)</text>

  <line x1="1240" y1="1140" x2="1460" y2="1460" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1350" y="1133" text-anchor="middle" fill="#fde047" font-size="12">3. INSERT PhieuNhap &amp; UPDATE SanPham.SoLuongTon (+SL)</text>

  <line x1="1240" y1="1235" x2="180" y2="1235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="710" y="1228" text-anchor="middle" fill="#cbd5e1" font-size="11">Tạo phiếu nhập thành công &amp; Tự động tăng tồn kho tương ứng</text>


  <!-- ========================================================================================= -->
  <!-- LUỒNG 5: PHÂN TÍCH BÁO CÁO DOANH THU & DASHBOARD QUẢN LÝ -->
  <!-- ========================================================================================= -->

  <rect x="50" y="1295" width="1500" height="230" rx="10" fill="url(#section5Grad)" stroke="#9d174d" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="1305" width="510" height="26" rx="5" fill="#9d174d"/>
  <text x="70" y="1323" fill="#fbcfe8" font-size="13" font-weight="bold">LUỒNG 5: PHÂN TÍCH BÁO CÁO DOANH THU, CẢNH BÁO TỒN KHO &amp; SP BÁN CHẠY</text>

  <line x1="180" y1="1355" x2="460" y2="1355" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="320" y="1348" text-anchor="middle" fill="#fef08a" font-size="12">1. Xem Dashboard [frmMain] &amp; Mở màn hình [Báo cáo Doanh thu]</text>

  <line x1="460" y1="1385" x2="1240" y2="1385" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="850" y="1378" text-anchor="middle" fill="#6ee7b7" font-size="12">2. BaoCaoDAO.GetDoanhThuTheoThang() &amp; GetTonKhoCanhBao()</text>

  <line x1="1240" y1="1475" x2="180" y2="1475" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="710" y="1468" text-anchor="middle" fill="#cbd5e1" font-size="11">Hiển thị biểu đồ doanh thu, sản phẩm bán chạy &amp; số lượng tồn cảnh báo</text>


  <!-- Bottom Participant Footer Boxes -->
  <g filter="url(#shadow)">
    <rect x="90" y="1530" width="180" height="40" rx="8" fill="url(#actorGrad)" stroke="#facc15" stroke-width="1.5"/>
    <text x="180" y="1555" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">👑 Quản Lý</text>

    <rect x="370" y="1530" width="180" height="40" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="460" y="1555" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🔔 Form Thông Báo</text>

    <rect x="630" y="1530" width="180" height="40" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="720" y="1555" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">📦 Hàng Hóa &amp; Kho</text>

    <rect x="890" y="1530" width="180" height="40" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="980" y="1555" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">👥 Nhân Sự &amp; Nhập Hàng</text>

    <rect x="1150" y="1530" width="180" height="40" rx="8" fill="url(#daoGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1240" y="1555" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">⚙️ DAO Services</text>

    <rect x="1380" y="1530" width="160" height="40" rx="8" fill="url(#dbGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1460" y="1555" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🗄️ SQL Database</text>
  </g>
</svg>
