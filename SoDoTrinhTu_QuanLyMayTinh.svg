<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="1600" height="1350" style="background-color: #0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="actorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="daoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="section1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>

    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>

    <marker id="arrow-dash" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1520" height="70" rx="12" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="58" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="1">SƠ ĐỒ TRÌNH TỰ NHIỆM VỤ (SEQUENCE DIAGRAM)</text>
  <text x="800" y="80" text-anchor="middle" fill="#94a3b8" font-size="13">HỆ THỐNG QUẢN LÝ CỬA HÀNG MÁY TÍNH &amp; THIẾT BỊ BÁN LẺ</text>

  <!-- Participant Lifelines -->
  <!-- X Coordinates:
       1. Khách hàng (Customer): 140
       2. Nhân viên (Staff): 360
       3. Kế toán (Accountant): 580
       4. Quản lý (Manager): 800
       5. WinForms UI: 1040
       6. DAO / Business Logic: 1280
       7. SQL Database: 1480
  -->

  <!-- Lifeline Vertical Lines -->
  <line x1="140" y1="170" x2="140" y2="1260" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="360" y1="170" x2="360" y2="1260" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="580" y1="170" x2="580" y2="1260" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="800" y1="170" x2="800" y2="1260" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1040" y1="170" x2="1040" y2="1260" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1280" y1="170" x2="1280" y2="1260" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1480" y1="170" x2="1480" y2="1260" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Top Participant Header Boxes -->
  <g filter="url(#shadow)">
    <!-- Customer -->
    <rect x="60" y="115" width="160" height="50" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="140" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">👤 Khách Hàng</text>

    <!-- Staff -->
    <rect x="280" y="115" width="160" height="50" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="360" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">👤 NV Bán Hàng</text>

    <!-- Accountant -->
    <rect x="500" y="115" width="160" height="50" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="580" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">💼 Kế Toán</text>

    <!-- Manager -->
    <rect x="720" y="115" width="160" height="50" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="800" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🏆 Quản Lý</text>

    <!-- WinForms UI -->
    <rect x="960" y="115" width="160" height="50" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1040" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🖥️ Giao Diện UI</text>

    <!-- DAO -->
    <rect x="1200" y="115" width="160" height="50" rx="8" fill="url(#daoGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1280" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">⚙️ DAO &amp; Logic</text>

    <!-- Database -->
    <rect x="1400" y="115" width="160" height="50" rx="8" fill="url(#dbGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1480" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🗄️ SQL Database</text>
  </g>

  <!-- ========================================================================================= -->
  <!-- SCENARIO 1: KHÁCH HÀNG ĐẶT HÀNG QUA GIỎ HÀNG (CUSTOMER CART & ORDER WORKFLOW) -->
  <!-- ========================================================================================= -->

  <!-- Section 1 Background Box -->
  <rect x="50" y="185" width="1500" height="340" rx="10" fill="url(#section1Grad)" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="195" width="460" height="26" rx="5" fill="#1e3a8a"/>
  <text x="70" y="213" fill="#93c5fd" font-size="13" font-weight="bold">LUỒNG 1: KHÁCH HÀNG THÊM GIỎ HÀNG, ĐẶT HÀNG &amp; HỦY / ĐẶT LẠI ĐƠN</text>

  <!-- 1.1 Customer adds to cart -->
  <line x1="140" y1="240" x2="1040" y2="240" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="590" y="233" text-anchor="middle" fill="#93c5fd" font-size="12">1. Chọn sản phẩm &amp; Bấm [🛒 Thêm vào giỏ hàng]</text>

  <path d="M 1040 240 Q 1090 240 1090 255 T 1040 270" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="1100" y="260" fill="#c084fc" font-size="11">GioHangManager.ThemVaoGio(sp, sl)</text>

  <!-- 1.2 Open Cart & Place Order -->
  <line x1="140" y1="300" x2="1040" y2="300" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="590" y="293" text-anchor="middle" fill="#93c5fd" font-size="12">2. Mở [frmGioHang] -&gt; Nhập PTTT, Ghi chú -&gt; Bấm [🚀 ĐẶT HÀNG TẤT CẢ]</text>

  <line x1="1040" y1="330" x2="1280" y2="330" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1160" y="323" text-anchor="middle" fill="#6ee7b7" font-size="12">3. DonHangDAO.Insert(dh, ctList)</text>

  <line x1="1280" y1="360" x2="1480" y2="360" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1380" y="353" text-anchor="middle" fill="#fde047" font-size="12">4. INSERT DonHang &amp; ChiTietDonHang</text>

  <line x1="1480" y1="390" x2="1280" y2="390" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="1380" y="383" text-anchor="middle" fill="#cbd5e1" font-size="11">Trả về MaDonHang mới (#ID)</text>

  <!-- 1.3 Trigger notification to Staff -->
  <path d="M 1280 390 Q 1340 400 1340 415 T 1280 430" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1350" y="415" fill="#6ee7b7" font-size="11">ThongBaoDAO.GuiThongBaoChoBanQuanLy("Cho xac nhan")</text>

  <line x1="1280" y1="460" x2="1040" y2="460" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="1160" y="453" text-anchor="middle" fill="#cbd5e1" font-size="11">Thông báo đặt hàng thành công &amp; Xóa sạch giỏ hàng</text>

  <line x1="1040" y1="490" x2="140" y2="490" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="590" y="483" text-anchor="middle" fill="#cbd5e1" font-size="11">Hiển thị MessageBox thành công + Cập nhật Lịch sử đơn hàng</text>


  <!-- ========================================================================================= -->
  <!-- SCENARIO 2: ĐỀ XUẤT SẢN PHẨM MỚI (STAFF) & KIỂM DUYỆT (MANAGER) -->
  <!-- ========================================================================================= -->

  <!-- Section 2 Background Box -->
  <rect x="50" y="540" width="1500" height="340" rx="10" fill="url(#section2Grad)" stroke="#581c87" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="550" width="460" height="26" rx="5" fill="#581c87"/>
  <text x="70" y="568" fill="#d8b4fe" font-size="13" font-weight="bold">LUỒNG 2: NV ĐỀ XUẤT THÊM SẢN PHẨM MỚI &amp; QUẢN LÝ KIỂM DUYỆT</text>

  <!-- 2.1 Staff submits proposal -->
  <line x1="360" y1="595" x2="1040" y2="595" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="700" y="588" text-anchor="middle" fill="#93c5fd" font-size="12">1. Điền [frmDeXuatSanPham] -&gt; Bấm [🚀 Gửi đề xuất cho Quản lý]</text>

  <line x1="1040" y1="625" x2="1280" y2="625" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1160" y="618" text-anchor="middle" fill="#6ee7b7" font-size="12">2. YeuCauThemSanPhamDAO.InsertDeXuat(yc)</text>

  <line x1="1280" y1="655" x2="1480" y2="655" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1380" y="648" text-anchor="middle" fill="#fde047" font-size="12">3. INSERT YeuCauThemSanPham (TrangThai = 'Cho duyet')</text>

  <path d="M 1280 655 Q 1340 670 1340 685 T 1280 700" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1350" y="682" fill="#6ee7b7" font-size="11">GuiThongBaoChoBanQuanLy("De xuat sp")</text>

  <!-- 2.2 Manager reviews & approves proposal -->
  <line x1="800" y1="735" x2="1040" y2="735" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="920" y="728" text-anchor="middle" fill="#93c5fd" font-size="12">4. Mở [frmThongBao] / [frmKiemDuyetDeXuat] -&gt; Bấm [✅ Duyệt &amp; Thêm SP]</text>

  <line x1="1040" y1="765" x2="1280" y2="765" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1160" y="758" text-anchor="middle" fill="#6ee7b7" font-size="12">5. YeuCauThemSanPhamDAO.DuyetYeuCau(maYC, maNV)</text>

  <line x1="1280" y1="795" x2="1480" y2="795" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1380" y="788" text-anchor="middle" fill="#fde047" font-size="12">6. INSERT SanPham &amp; UPDATE YeuCau (TrangThai = 'Da duyet')</text>

  <path d="M 1280 795 Q 1340 810 1340 825 T 1280 840" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1350" y="822" fill="#6ee7b7" font-size="11">GuiThongBaoChoNhanVienDeXuat("Phê duyệt")</text>

  <line x1="1280" y1="855" x2="800" y2="855" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="1040" y="848" text-anchor="middle" fill="#cbd5e1" font-size="11">Sản phẩm chính thức thêm vào CSDL &amp; Thông báo tới NV thành công</text>


  <!-- ========================================================================================= -->
  <!-- SCENARIO 3: KẾ TOÁN LẬP HÓA ĐƠN & HỆ THỐNG TỰ ĐỘNG TRỪ TỒN KHO -->
  <!-- ========================================================================================= -->

  <!-- Section 3 Background Box -->
  <rect x="50" y="895" width="1500" height="340" rx="10" fill="url(#section3Grad)" stroke="#064e3b" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="905" width="480" height="26" rx="5" fill="#064e3b"/>
  <text x="70" y="923" fill="#6ee7b7" font-size="13" font-weight="bold">LUỒNG 3: KẾ TOÁN LẬP HÓA ĐƠN &amp; HỆ THỐNG TỰ ĐỘNG TRỪ TỒN KHO</text>

  <!-- 3.1 Accountant creates invoice -->
  <line x1="580" y1="950" x2="1040" y2="950" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="810" y="943" text-anchor="middle" fill="#93c5fd" font-size="12">1. Chọn đơn đã xác nhận -&gt; Bấm [🧾 Lập Hóa Đơn &amp; Xác nhận TT]</text>

  <line x1="1040" y1="980" x2="1280" y2="980" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1160" y="973" text-anchor="middle" fill="#6ee7b7" font-size="12">2. HoaDonDAO.CapNhatTrangThaiThanhToan(maHD, 'Da thanh toan')</text>

  <line x1="1280" y1="1010" x2="1480" y2="1010" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1380" y="1003" text-anchor="middle" fill="#fde047" font-size="12">3. UPDATE HoaDon (TrangThai = 'Da thanh toan')</text>

  <!-- 3.2 System auto deducts stock -->
  <line x1="1480" y1="1040" x2="1280" y2="1040" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1380" y="1033" text-anchor="middle" fill="#6ee7b7" font-size="12">4. [HỆ THỐNG TỰ ĐỘNG] Trừ số lượng tồn kho SanPham</text>

  <line x1="1280" y1="1070" x2="1480" y2="1070" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1380" y="1063" text-anchor="middle" fill="#fde047" font-size="12">5. UPDATE SanPham SET SoLuongTon = SoLuongTon - @SL</text>

  <path d="M 1280 1070 Q 1340 1085 1340 1100 T 1280 1115" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1350" y="1098" fill="#6ee7b7" font-size="11">UPDATE DonHang (TrangThai = 'Hoan tat')</text>

  <path d="M 1280 1115 Q 1340 1130 1340 1145 T 1280 1160" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1350" y="1143" fill="#6ee7b7" font-size="11">ThongBaoDAO.GuiThongBaoChoKhachHang("Đã hoàn tất")</text>

  <line x1="1280" y1="1190" x2="580" y2="1190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="930" y="1183" text-anchor="middle" fill="#cbd5e1" font-size="11">Cập nhật hóa đơn thành công &amp; Tự động trừ kho hoàn tất</text>

  <!-- Bottom Participant Footer Boxes -->
  <g filter="url(#shadow)">
    <rect x="60" y="1270" width="160" height="40" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="140" y="1295" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">👤 Khách Hàng</text>

    <rect x="280" y="1270" width="160" height="40" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="360" y="1295" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">👤 NV Bán Hàng</text>

    <rect x="500" y="1270" width="160" height="40" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="580" y="1295" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">💼 Kế Toán</text>

    <rect x="720" y="1270" width="160" height="40" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="800" y="1295" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🏆 Quản Lý</text>

    <rect x="960" y="1270" width="160" height="40" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1040" y="1295" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🖥️ Giao Diện UI</text>

    <rect x="1200" y="1270" width="160" height="40" rx="8" fill="url(#daoGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="1280" y="1295" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">⚙️ DAO &amp; Logic</text>

    <rect x="1400" y="1270" width="160" height="40" rx="8" fill="url(#dbGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1480" y="1295" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🗄️ SQL Database</text>
  </g>
</svg>
