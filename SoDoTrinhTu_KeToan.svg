<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1450" width="1600" height="1450" style="background-color: #0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="actorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="daoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="systemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="section1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <linearGradient id="section4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>

    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>

    <marker id="arrow-dash" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1520" height="70" rx="12" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="58" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="1">SƠ ĐỒ TRÌNH TỰ NGHIỆP VỤ — ROLE KẾ TOÁN (IsKeToan)</text>
  <text x="800" y="80" text-anchor="middle" fill="#94a3b8" font-size="13">LẬP HÓA ĐƠN BÁN HÀNG, CẬP NHẬT THANH TOÁN &amp; HỆ THỐNG TỰ ĐỘNG KHẤU TRỪ TỒN KHO</text>

  <!-- Participant Lifelines -->
  <!-- X Coordinates:
       1. Kế toán (Accountant): 180
       2. Màn hình Hóa đơn (frmHoaDon): 460
       3. Giao diện Hàng hóa Read-Only (frmSanPham): 720
       4. DAO Services (HoaDonDAO / DonHangDAO): 980
       5. Hệ thống Tự động (System Auto Engine): 1240
       6. SQL Server Database: 1460
  -->

  <!-- Lifeline Vertical Lines -->
  <line x1="180" y1="170" x2="180" y2="1360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="460" y1="170" x2="460" y2="1360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="720" y1="170" x2="720" y2="1360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="980" y1="170" x2="980" y2="1360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1240" y1="170" x2="1240" y2="1360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="1460" y1="170" x2="1460" y2="1360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Top Participant Header Boxes -->
  <g filter="url(#shadow)">
    <!-- Accountant -->
    <rect x="90" y="115" width="180" height="50" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="180" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">💼 Kế Toán</text>

    <!-- frmHoaDon -->
    <rect x="370" y="115" width="180" height="50" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="460" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🧾 Form Hóa Đơn</text>

    <!-- frmSanPham ReadOnly -->
    <rect x="630" y="115" width="180" height="50" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="720" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">📦 Form SP (Chỉ Xem)</text>

    <!-- DAO -->
    <rect x="890" y="115" width="180" height="50" rx="8" fill="url(#daoGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="980" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">⚙️ DAO Services</text>

    <!-- System Auto Engine -->
    <rect x="1150" y="115" width="180" height="50" rx="8" fill="url(#systemGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="1240" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🤖 Hệ Thống Tự Động</text>

    <!-- Database -->
    <rect x="1380" y="115" width="160" height="50" rx="8" fill="url(#dbGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1460" y="145" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🗄️ SQL Database</text>
  </g>

  <!-- ========================================================================================= -->
  <!-- LUỒNG 1: LẬP HÓA ĐƠN BÁN HÀNG TỪ ĐƠN HÀNG ĐÃ XÁC NHẬN -->
  <!-- ========================================================================================= -->

  <rect x="50" y="185" width="1500" height="270" rx="10" fill="url(#section1Grad)" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="195" width="480" height="26" rx="5" fill="#1e3a8a"/>
  <text x="70" y="213" fill="#93c5fd" font-size="13" font-weight="bold">LUỒNG 1: LẬP HÓA ĐƠN BÁN HÀNG TỪ ĐƠN HÀNG ĐÃ XÁC NHẬN</text>

  <!-- 1.1 Select confirmed order -->
  <line x1="180" y1="240" x2="460" y2="240" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="320" y="233" text-anchor="middle" fill="#93c5fd" font-size="12">1. Chọn đơn hàng [Da xac nhan] trên danh sách</text>

  <line x1="460" y1="270" x2="980" y2="270" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="720" y="263" text-anchor="middle" fill="#6ee7b7" font-size="12">2. DonHangDAO.GetById(maDonHang)</text>

  <!-- 1.2 Issue Invoice -->
  <line x1="180" y1="310" x2="460" y2="310" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="320" y="303" text-anchor="middle" fill="#93c5fd" font-size="12">3. Bấm nút [🧾 Lập Hóa Đơn Bán Hàng]</text>

  <line x1="460" y1="340" x2="980" y2="340" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="720" y="333" text-anchor="middle" fill="#6ee7b7" font-size="12">4. HoaDonDAO.Insert(hoaDon)</text>

  <line x1="980" y1="370" x2="1460" y2="370" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1220" y="363" text-anchor="middle" fill="#fde047" font-size="12">5. INSERT INTO HoaDon (TrangThaiThanhToan = 'Chua thanh toan')</text>

  <line x1="980" y1="415" x2="180" y2="415" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="580" y="408" text-anchor="middle" fill="#cbd5e1" font-size="11">Tạo Hóa đơn mới thành công &amp; Hiển thị danh sách hóa đơn</text>


  <!-- ========================================================================================= -->
  <!-- LUỒNG 2: CẬP NHẬT THANH TOÁN & HỆ THỐNG TỰ ĐỘNG KHẤU TRỪ TỒN KHO -->
  <!-- ========================================================================================= -->

  <rect x="50" y="475" width="1500" height="340" rx="10" fill="url(#section2Grad)" stroke="#064e3b" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="485" width="510" height="26" rx="5" fill="#064e3b"/>
  <text x="70" y="503" fill="#6ee7b7" font-size="13" font-weight="bold">LUỒNG 2: XÁC NHẬN THANH TOÁN &amp; HỆ THỐNG TỰ ĐỘNG KHẤU TRỪ TỒN KHO</text>

  <!-- 2.1 Update payment status -->
  <line x1="180" y1="530" x2="460" y2="530" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="320" y="523" text-anchor="middle" fill="#93c5fd" font-size="12">1. Chọn hóa đơn -&gt; Bấm nút [✅ Đã Thanh Toán]</text>

  <line x1="460" y1="560" x2="980" y2="560" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="720" y="553" text-anchor="middle" fill="#6ee7b7" font-size="12">2. HoaDonDAO.CapNhatTrangThaiThanhToan(maHD, 'Da thanh toan')</text>

  <line x1="980" y1="590" x2="1460" y2="590" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1220" y="583" text-anchor="middle" fill="#fde047" font-size="12">3. UPDATE HoaDon SET TrangThaiThanhToan = 'Da thanh toan'</text>

  <!-- 2.2 System auto triggers stock deduction -->
  <line x1="980" y1="620" x2="1240" y2="620" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="1110" y="613" text-anchor="middle" fill="#67e8f9" font-size="12">4. [HỆ THỐNG TỰ ĐỘNG] Kích hoạt tiến trình cập nhật tồn kho</text>

  <line x1="1240" y1="650" x2="1460" y2="650" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1350" y="643" text-anchor="middle" fill="#fde047" font-size="12">5. UPDATE SanPham SET SoLuongTon = SoLuongTon - @SL</text>

  <line x1="1240" y1="680" x2="1460" y2="680" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="1350" y="673" text-anchor="middle" fill="#fde047" font-size="12">6. UPDATE DonHang SET TrangThaiDonHang = 'Hoan tat'</text>

  <path d="M 1240 680 Q 1300 695 1300 710 T 1240 725" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="1310" y="708" fill="#67e8f9" font-size="11">ThongBaoDAO.GuiThongBaoChoKhachHang("🎉 Đơn hàng #ID đã hoàn tất")</text>

  <line x1="980" y1="775" x2="180" y2="775" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="580" y="768" text-anchor="middle" fill="#cbd5e1" font-size="11">Xác nhận thanh toán thành công &amp; Hệ thống tự động trừ kho hoàn tất</text>


  <!-- ========================================================================================= -->
  <!-- LUỒNG 3: TRA CỨU DANH SÁCH HÓA ĐƠN VÀ BÁO CÁO DOANH THU -->
  <!-- ========================================================================================= -->

  <rect x="50" y="835" width="1500" height="230" rx="10" fill="url(#section3Grad)" stroke="#78350f" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="845" width="480" height="26" rx="5" fill="#78350f"/>
  <text x="70" y="863" fill="#fde047" font-size="13" font-weight="bold">LUỒNG 3: TRA CỨU LỊCH SỬ HÓA ĐƠN &amp; XEM CHI TIẾT BÁO CÁO</text>

  <line x1="180" y1="895" x2="460" y2="895" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="320" y="888" text-anchor="middle" fill="#93c5fd" font-size="12">1. Xem danh sách Hóa đơn (Phân trang 10 HĐ/trang)</text>

  <line x1="460" y1="925" x2="980" y2="925" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="720" y="918" text-anchor="middle" fill="#6ee7b7" font-size="12">2. HoaDonDAO.GetAll() (ORDER BY MaHoaDon DESC)</text>

  <line x1="180" y1="965" x2="460" y2="965" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="320" y="958" text-anchor="middle" fill="#93c5fd" font-size="12">3. Double-click dòng Hóa đơn -&gt; Mở [frmChiTietDonHangDialog]</text>

  <line x1="460" y1="1015" x2="180" y2="1015" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="320" y="1008" text-anchor="middle" fill="#cbd5e1" font-size="11">Hiển thị thông tin mặt hàng, người lập, ngày lập &amp; tổng tiền</text>


  <!-- ========================================================================================= -->
  <!-- LUỒNG 4: GIỚI HẠN QUYỀN HÀNG HÓA & KHÔNG XEM TỒN KHO -->
  <!-- ========================================================================================= -->

  <rect x="50" y="1085" width="1500" height="230" rx="10" fill="url(#section4Grad)" stroke="#581c87" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="60" y="1095" width="510" height="26" rx="5" fill="#581c87"/>
  <text x="70" y="1113" fill="#d8b4fe" font-size="13" font-weight="bold">LUỒNG 4: TỰ ĐỘNG ẨN MỤC TỒN KHO &amp; GIỚI HẠN QUYỀN CHỈ XEM HÀNG HÓA</text>

  <line x1="180" y1="1145" x2="720" y2="1145" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="450" y="1138" text-anchor="middle" fill="#93c5fd" font-size="12">1. Mở màn hình Hàng hóa [frmSanPham] (Mục Tồn kho Sidebar bị ẨN)</text>

  <path d="M 720 1145 Q 770 1160 770 1175 T 720 1190" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="780" y="1173" fill="#c084fc" font-size="11">Tự động ẨN nút Thêm, Sửa, Xóa trên Toolbar</text>

  <line x1="180" y1="1225" x2="720" y2="1225" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="450" y="1218" text-anchor="middle" fill="#93c5fd" font-size="12">2. Double-click dòng SP -&gt; Mở Form Read-Only [frmEditSanPham]</text>

  <line x1="720" y1="1265" x2="180" y2="1265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-dash)"/>
  <text x="450" y="1258" text-anchor="middle" fill="#cbd5e1" font-size="11">Khóa toàn bộ thao tác sửa đổi, bảo đảm đúng nghiệp vụ Kế toán</text>


  <!-- Bottom Participant Footer Boxes -->
  <g filter="url(#shadow)">
    <rect x="90" y="1380" width="180" height="40" rx="8" fill="url(#actorGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="180" y="1405" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">💼 Kế Toán</text>

    <rect x="370" y="1380" width="180" height="40" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="460" y="1405" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🧾 Form Hóa Đơn</text>

    <rect x="630" y="1380" width="180" height="40" rx="8" fill="url(#uiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="720" y="1405" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">📦 Form SP (Chỉ Xem)</text>

    <rect x="890" y="1380" width="180" height="40" rx="8" fill="url(#daoGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="980" y="1405" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">⚙️ DAO Services</text>

    <rect x="1150" y="1380" width="180" height="40" rx="8" fill="url(#systemGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="1240" y="1405" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🤖 Hệ Thống Tự Động</text>

    <rect x="1380" y="1380" width="160" height="40" rx="8" fill="url(#dbGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1460" y="1405" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🗄️ SQL Database</text>
  </g>
</svg>
